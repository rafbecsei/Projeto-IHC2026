<text x="50" y="922" font-size="11.5" font-weight="bold">Legenda</text>
<text x="50" y="941" font-size="11.5">●  ponto de abertura      ◉  ponto de encerramento</text>
<text x="50" y="960" font-size="11.5">■  processamento do sistema</text>
<text x="50" y="979" font-size="11.5">u: fala do usuário  ·  d: fala do designer (preposto)</text>
<text x="50" y="998" font-size="11.5">d+u: signo negociado entre designer e usuário</text>
<text x="50" y="1017" font-size="11.5">gco / gcc: objetivo iniciado / concluído</text>
<text x="50" y="1036" font-size="11.5">[SR] cena de ruptura (contorno tracejado)</text>
<text x="50" y="1055" font-size="11.5">seta tracejada: fala de recuperação/saída de ruptura</text>
