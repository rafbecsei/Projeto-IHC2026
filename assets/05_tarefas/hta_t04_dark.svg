<text fill="#ffffff" x="760" y="34.5" font-size="13" text-anchor="middle">0. Consultar o risco de alagamento ao longo da linha</text>
<text fill="#ffffff" x="760" y="50.5" font-size="13" text-anchor="middle">de transporte público e decidir como se deslocar</text>
<text fill="#ffffff" x="760" y="66.5" font-size="13" text-anchor="middle">1 &gt; 2 &gt; 3 &gt; 4</text>
