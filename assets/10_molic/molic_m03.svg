<text x="650.0" y="728.5" font-size="12" text-anchor="middle">período de referência</text>
<rect x="1060" y="600" width="360" height="160" rx="8" fill="#fff" stroke="#000" stroke-width="1.3"/>
<line x1="1060" y1="630" x2="1420" y2="630" stroke="#000" stroke-width="1.3"/>
<text x="1240.0" y="620" font-size="13" font-weight="bold" text-anchor="middle">Consultar informações complementares</text>
<text x="1240.0" y="676.0" font-size="12" text-anchor="middle">ver condições de chuva</text>
<text x="1240.0" y="691.0" font-size="12" text-anchor="middle">d: chuva, período</text>
<text x="1240.0" y="706.0" font-size="12" text-anchor="middle">ver ocorrências de alagamento</text>
<text x="1240.0" y="721.0" font-size="12" text-anchor="middle">d: ocorrência de alagamento, região</text>
