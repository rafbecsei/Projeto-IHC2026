<text x="190.0" y="646.0" font-size="12" text-anchor="middle">para uma estimativa confiável</text>
<text x="190.0" y="661.0" font-size="12" text-anchor="middle">(ausência de dados não é</text>
<text x="190.0" y="676.0" font-size="12" text-anchor="middle">comunicada como risco baixo)</text>
