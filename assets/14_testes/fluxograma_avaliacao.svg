  <line class="arrow" x1="1140" y1="165" x2="1190" y2="165"/>

  <rect class="box" x="1190" y="120" width="150" height="90" rx="18"/>
  <text class="txt" x="1265" y="165">Pós-teste</text>

  <path class="arrow" d="M1340 165 H1390 V290 H1020"/>

  <rect class="box" x="790" y="245" width="230" height="90" rx="18"/>
  <text class="txt" x="905" y="278">Consolidação /</text>
  <text class="txt" x="905" y="307">análise</text>

  <line class="arrow" x1="790" y1="290" x2="740" y2="290"/>

  <rect class="box" x="510" y="245" width="230" height="90" rx="18"/>
  <text class="txt" x="625" y="290">Recomendações</text>
