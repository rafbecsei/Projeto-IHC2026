<text x="650.0" y="190" font-size="13" font-weight="bold" text-anchor="middle">Identificar região onde mora</text>
<text x="650.0" y="223.5" font-size="12" text-anchor="middle">informar região</text>
<text x="650.0" y="238.5" font-size="12" text-anchor="middle">d+u: região, localização</text>
<text x="650.0" y="253.5" font-size="12" text-anchor="middle">(nome, bairro ou seleção no mapa)</text>
<text x="650.0" y="268.5" font-size="12" text-anchor="middle">confirmar região consultada</text>
<text x="650.0" y="283.5" font-size="12" text-anchor="middle">d: região identificada</text>
