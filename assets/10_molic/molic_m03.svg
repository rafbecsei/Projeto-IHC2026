<text x="650.0" y="966.0" font-size="12" text-anchor="middle">d: risco, período e contexto da chuva</text>
<text x="650.0" y="981.0" font-size="12" text-anchor="middle">considerar medidas preventivas</text>
<text x="650.0" y="996.0" font-size="12" text-anchor="middle">d: medidas preventivas (proteger objetos</text>
<text x="650.0" y="1011.0" font-size="12" text-anchor="middle">e equipamentos, verificar pontos</text>
<text x="650.0" y="1026.0" font-size="12" text-anchor="middle">vulneráveis, acompanhar a situação)</text>
